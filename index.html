<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheetCompose · Pure Sheet Music</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- ABCJS for sheet music rendering and playback -->
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f3efe9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .app {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      padding: 2rem 2rem 2.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #1e1b1a;
    }
    h1 i {
      color: #c44536;
    }

    .subhead {
      color: #5f5b58;
      border-left: 4px solid #c44536;
      padding-left: 1rem;
      font-weight: 400;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .subhead span {
      background: #f0ebe6;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 2.2fr;
      gap: 2rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 860px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- LEFT PANEL ---------- */
    .panel-left {
      background: #faf8f6;
      border-radius: 1.8rem;
      padding: 1.5rem;
      border: 1px solid #ede8e2;
    }

    .panel-left h3 {
      font-weight: 600;
      font-size: 1rem;
      color: #2d2a27;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      letter-spacing: -0.01em;
    }

    .instrument-group {
      margin-bottom: 1.8rem;
    }
    .instrument-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b6560;
      margin-bottom: 0.5rem;
    }

    .inst-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .inst-btn {
      background: white;
      border: 1px solid #ddd8d2;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1 0 auto;
      justify-content: center;
    }
    .inst-btn.active {
      background: #1e1b1a;
      border-color: #1e1b1a;
      color: white;
    }
    .inst-btn:hover:not(.active) {
      background: #f0ebe6;
    }

    .articulation-group {
      margin-top: 0.5rem;
    }
    .articulation-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b6560;
      margin-bottom: 0.5rem;
    }
    .art-badge {
      display: inline-block;
      background: white;
      border: 1px solid #ddd8d2;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.1s;
      margin: 0.15rem 0.15rem 0.15rem 0;
    }
    .art-badge.active {
      background: #c44536;
      border-color: #c44536;
      color: white;
    }
    .art-badge:hover:not(.active) {
      background: #f0ebe6;
    }

    .action-bar {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      border-top: 1px solid #e5ded7;
      padding-top: 1.5rem;
    }
    .btn-primary {
      background: #1e1b1a;
      border: none;
      color: white;
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary:hover {
      background: #3d2f2b;
      transform: scale(0.97);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #c5bdb5;
      color: #3d3a37;
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-outline:hover {
      background: #f0ebe6;
    }
    .status-badge {
      margin-left: auto;
      font-size: 0.7rem;
      background: #e8e0d9;
      padding: 0.2rem 1.2rem;
      border-radius: 30px;
      color: #3d3a37;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ---------- RIGHT PANEL: SHEET MUSIC ---------- */
    .panel-right {
      background: #fcfaf8;
      border-radius: 1.8rem;
      padding: 1.5rem 1.5rem 1.8rem;
      border: 1px solid #ede8e2;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .player-header h3 {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2d2a27;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .play-btn {
      background: #c44536;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(196, 69, 54, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover {
      background: #a8372a;
      transform: scale(0.95);
    }
    .play-btn.playing {
      background: #3d3a37;
    }

    /* Sheet music container */
    #sheetContainer {
      background: white;
      border-radius: 1.2rem;
      padding: 1.2rem 0.5rem 0.8rem 0.5rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #e8e0d9;
      min-height: 200px;
      overflow-x: auto;
    }
    #sheetContainer svg {
      width: 100% !important;
      height: auto !important;
    }

    /* Note input controls */
    .note-input-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.2rem;
      align-items: center;
      background: #f4f0eb;
      padding: 0.6rem 1rem;
      border-radius: 60px;
    }
    .note-input-bar label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #4d4843;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .note-input-bar select,
    .note-input-bar input[type="number"] {
      background: white;
      border: 1px solid #d5cdc4;
      border-radius: 30px;
      padding: 0.25rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e1b1a;
      outline: none;
    }
    .note-input-bar select:focus,
    .note-input-bar input:focus {
      border-color: #c44536;
    }

    .add-note-btn {
      background: #1e1b1a;
      border: none;
      color: white;
      padding: 0.3rem 1.4rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .add-note-btn:hover {
      background: #3d2f2b;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #8f8982;
      text-align: center;
      border-top: 1px solid #ede8e2;
      padding-top: 1.2rem;
    }
    .footer-note i {
      margin: 0 4px;
    }
    .public-badge-sm {
      background: #1e1b1a;
      color: white;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1><i class="fas fa-music"></i> SheetCompose</h1>
      <div class="subhead">
        <span><i class="fas fa-pen-fancy"></i> Pure sheet music</span>
        <span><i class="far fa-clock"></i> 4/4 · C major</span>
      </div>
    </div>
  </header>

  <div class="grid-2col">
    <!-- LEFT PANEL -->
    <div class="panel-left">
      <h3><i class="fas fa-sliders-h"></i> Instrument</h3>
      <div class="instrument-group">
        <label>Choose sound</label>
        <div class="inst-selector" id="instrumentSelector">
          <button class="inst-btn active" data-instrument="piano"><i class="fas fa-piano"></i> Piano</button>
          <button class="inst-btn" data-instrument="guitar"><i class="fas fa-guitar"></i> Guitar</button>
          <button class="inst-btn" data-instrument="violin"><i class="fas fa-violin"></i> Violin</button>
          <button class="inst-btn" data-instrument="flute"><i class="fas fa-flute"></i> Flute</button>
        </div>
      </div>

      <div class="articulation-group">
        <label><i class="fas fa-flag"></i> Articulation</label>
        <div id="articulationContainer">
          <span class="art-badge active" data-articulation="legato">legato</span>
          <span class="art-badge" data-articulation="staccato">staccato</span>
          <span class="art-badge" data-articulation="marcato">marcato</span>
          <span class="art-badge" data-articulation="pizzicato">pizzicato</span>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save</button>
        <button class="btn-outline" id="postBtn"><i class="fas fa-globe"></i> Post</button>
        <span class="status-badge" id="statusBadge"><i class="fas fa-check-circle" style="color:#2b7a4b;"></i> draft</span>
      </div>
      <div style="margin-top:0.5rem; font-size:0.7rem; color:#7b736b; display:flex; gap:1.2rem;">
        <span><i class="far fa-save"></i> auto-save</span>
        <span><i class="fas fa-user-friends"></i> public view</span>
      </div>
    </div>

    <!-- RIGHT PANEL: SHEET MUSIC -->
    <div class="panel-right">
      <div class="player-header">
        <h3><i class="fas fa-score"></i> Sheet Music</h3>
        <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
      </div>

      <!-- Sheet music renders here -->
      <div id="sheetContainer"></div>

      <!-- Note input: add notes to the sheet -->
      <div class="note-input-bar">
        <label><i class="fas fa-note-sticky"></i> Add note</label>
        <select id="noteSelect">
          <option value="C4">C4</option><option value="D4">D4</option><option value="E4">E4</option>
          <option value="F4">F4</option><option value="G4">G4</option><option value="A4">A4</option>
          <option value="B4">B4</option><option value="C5">C5</option>
        </select>
        <select id="durationSelect">
          <option value="4">Quarter</option>
          <option value="8">Eighth</option>
          <option value="2">Half</option>
          <option value="1">Whole</option>
        </select>
        <button class="add-note-btn" id="addNoteBtn"><i class="fas fa-plus"></i> Add</button>
        <button class="add-note-btn" id="clearBtn" style="background:#6b6560;"><i class="fas fa-trash"></i> Clear</button>
      </div>

      <div class="footer-note">
        <span class="public-badge-sm"><i class="fas fa-eye"></i> public</span>
        <span style="margin-left:1rem;"><i class="fas fa-edit"></i> click "Add" to place notes · press play to hear</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- STATE -----
    const state = {
      instrument: 'piano',
      articulation: 'legato',
      // ABC notation stores the melody as a string
      abcTune: '',
      // We'll store notes as an array of { pitch, duration }
      notes: [],
    };

    // DOM refs
    const sheetContainer = document.getElementById('sheetContainer');
    const playBtn = document.getElementById('playBtn');
    const statusBadge = document.getElementById('statusBadge');
    const noteSelect = document.getElementById('noteSelect');
    const durationSelect = document.getElementById('durationSelect');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const clearBtn = document.getElementById('clearBtn');

    // Instrument & Articulation buttons
    const instBtns = document.querySelectorAll('.inst-btn');
    const artBadges = document.querySelectorAll('.art-badge');

    // ----- ABC rendering -----
    function renderSheet() {
      // Build ABC string from notes
      let abcBody = '';
      if (state.notes.length === 0) {
        // Empty measure (rest)
        abcBody = 'z4 |';
      } else {
        // Group notes into measures of 4 beats (simple)
        let currentMeasure = [];
        let measureDuration = 0;
        const measures = [];

        state.notes.forEach(n => {
          const dur = parseInt(n.duration);
          if (measureDuration + dur > 4) {
            // close measure
            if (currentMeasure.length) measures.push(currentMeasure.join(' '));
            currentMeasure = [];
            measureDuration = 0;
          }
          // articulation symbol (simplified)
          let art = '';
          if (state.articulation === 'staccato') art = '.';
          else if (state.articulation === 'marcato') art = '^';
          else if (state.articulation === 'pizzicato') art = 'pizz.';
          // pitch + duration
          let noteStr = n.pitch;
          if (dur === 8) noteStr += '/';
          else if (dur === 2) noteStr += '2';
          else if (dur === 1) noteStr += '1';
          else noteStr += '4'; // quarter default
          if (art) noteStr = art + noteStr;
          currentMeasure.push(noteStr);
          measureDuration += dur;
        });
        if (currentMeasure.length) measures.push(currentMeasure.join(' '));
        // fill last measure if needed
        abcBody = measures.join(' | ') + ' |';
      }

      const abc = `X:1\nT:Composition\nM:4/4\nL:1/8\nK:C\n${abcBody}`;
      state.abcTune = abc;

      // Render with abcjs
      try {
        sheetContainer.innerHTML = '';
        ABCJS.renderAbc(sheetContainer, abc, {
          responsive: 'resize',
          scale: 1.2,
          staffwidth: 580,
        });
      } catch (e) {
        sheetContainer.innerHTML = `<p style="color:#b85a4b; padding:1rem;">⚠️ Could not render sheet: ${e.message}</p>`;
      }
    }

    // ----- Playback using ABCJS -----
    let isPlaying = false;
    let audioCtx = null;

    function playTune() {
      if (isPlaying) {
        stopPlayback();
        return;
      }
      if (state.notes.length === 0) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> no notes`;
        setTimeout(() => updateStatusDraft(), 1200);
        return;
      }

      // Use ABCJS synth
      try {
        const visualObj = ABCJS.renderAbc(sheetContainer, state.abcTune, { responsive: 'resize', scale: 1.2 });
        if (visualObj && visualObj[0]) {
          // Create synth
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          const synth = new ABCJS.synth.Synth();
          // We need to pass the visualObj and options
          synth.init({
            visualObj: visualObj,
            audioContext: audioCtx,
            options: { 
              instrument: state.instrument || 'piano',
              // articulation is handled via the notation itself
            }
          }).then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-stop"></i>';
            playBtn.classList.add('playing');
            statusBadge.innerHTML = `<i class="fas fa-play" style="color:#c44536;"></i> playing`;
            synth.play();
            // When done, reset
            synth.on('finished', () => {
              stopPlayback();
            });
          }).catch(err => {
            console.warn('Playback error:', err);
            statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> playback error`;
            setTimeout(updateStatusDraft, 1500);
          });
        }
      } catch (e) {
        console.warn('ABC play error:', e);
      }
    }

    function stopPlayback() {
      isPlaying = false;
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      playBtn.classList.remove('playing');
      updateStatusDraft();
      // Try to stop synth (hacky but works)
      try {
        const synth = ABCJS.synth.Synth.getCurrentSynth();
        if (synth) synth.stop();
      } catch(e) {}
    }

    // ----- Helpers -----
    function updateStatusDraft() {
      statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> draft`;
    }

    function addNote(pitch, duration) {
      state.notes.push({ pitch, duration: String(duration) });
      renderSheet();
      updateStatusDraft();
    }

    function clearNotes() {
      state.notes = [];
      renderSheet();
      updateStatusDraft();
      statusBadge.innerHTML = `<i class="fas fa-eraser"></i> cleared`;
      setTimeout(updateStatusDraft, 1000);
    }

    // ----- Save & Post -----
    function saveComposition() {
      if (state.notes.length === 0) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> nothing to save`;
        setTimeout(updateStatusDraft, 1500);
        return;
      }
      statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> saved ✓`;
      setTimeout(updateStatusDraft, 2000);
    }

    function postComposition() {
      if (state.notes.length === 0) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> add notes first`;
        setTimeout(updateStatusDraft, 1500);
        return;
      }
      statusBadge.innerHTML = `<i class="fas fa-globe" style="color:#1e6f5c;"></i> posted public!`;
      setTimeout(() => {
        statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> public`;
      }, 2000);
    }

    // ----- Event bindings -----
    // Instrument
    instBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isPlaying) return;
        state.instrument = btn.dataset.instrument;
        instBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Articulation
    artBadges.forEach(badge => {
      badge.addEventListener('click', () => {
        if (isPlaying) return;
        state.articulation = badge.dataset.articulation;
        artBadges.forEach(b => b.classList.remove('active'));
        badge.classList.add('active');
        renderSheet(); // re-render with new articulation
      });
    });

    // Play
    playBtn.addEventListener('click', playTune);

    // Add note
    addNoteBtn.addEventListener('click', () => {
      if (isPlaying) return;
      const pitch = noteSelect.value;
      const duration = parseInt(durationSelect.value);
      addNote(pitch, duration);
    });

    // Clear
    clearBtn.addEventListener('click', () => {
      if (isPlaying) return;
      clearNotes();
    });

    // Save & Post
    document.getElementById('saveBtn').addEventListener('click', saveComposition);
    document.getElementById('postBtn').addEventListener('click', postComposition);

    // Keyboard shortcut: Enter to add note
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'SELECT') {
        addNoteBtn.click();
      }
    });

    // Initial render with a demo melody (Twinkle Twinkle)
    function loadDemo() {
      const demo = [
        { pitch: 'C4', duration: '4' }, { pitch: 'C4', duration: '4' }, { pitch: 'G4', duration: '4' }, { pitch: 'G4', duration: '4' },
        { pitch: 'A4', duration: '4' }, { pitch: 'A4', duration: '4' }, { pitch: 'G4', duration: '2' },
        { pitch: 'F4', duration: '4' }, { pitch: 'F4', duration: '4' }, { pitch: 'E4', duration: '4' }, { pitch: 'E4', duration: '4' },
        { pitch: 'D4', duration: '4' }, { pitch: 'D4', duration: '4' }, { pitch: 'C4', duration: '2' },
      ];
      state.notes = demo;
      renderSheet();
      updateStatusDraft();
    }
    loadDemo();

    // Cleanup playback on page unload
    window.addEventListener('beforeunload', () => {
      if (isPlaying) stopPlayback();
      if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
    });

  })();
</script>
</body>
</html>
