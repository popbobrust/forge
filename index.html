<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compose · Music Studio</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f7f4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      padding: 2rem 2rem 2.5rem;
      transition: all 0.2s;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #1e1b1a;
      margin-bottom: 0.25rem;
    }

    h1 i {
      color: #c44536;
      font-size: 2rem;
    }

    .subhead {
      color: #5f5b58;
      margin-bottom: 2rem;
      border-left: 4px solid #c44536;
      padding-left: 1rem;
      font-weight: 400;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .subhead span {
      background: #f0ebe6;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      color: #3d3a37;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1.2fr 2fr;
      gap: 2rem;
      margin-top: 0.75rem;
    }

    @media (max-width: 820px) {
      .grid-2col {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    /* -------- left panel -------- */
    .panel-left {
      background: #faf8f6;
      border-radius: 1.8rem;
      padding: 1.5rem 1.2rem;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
      border: 1px solid #ede8e2;
    }

    .panel-left h3 {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2d2a27;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    .instrument-group {
      margin-bottom: 2rem;
    }

    .instrument-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b6560;
      margin-bottom: 0.4rem;
    }

    .instrument-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .inst-btn {
      background: white;
      border: 1px solid #ddd8d2;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2d2a27;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }

    .inst-btn i {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .inst-btn.active {
      background: #1e1b1a;
      border-color: #1e1b1a;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .inst-btn.active i {
      opacity: 1;
      color: #f0c9b0;
    }

    .inst-btn:hover:not(.active) {
      background: #f0ebe6;
      border-color: #b8b0a8;
    }

    /* articulations */
    .articulation-group {
      margin-top: 1.8rem;
    }

    .articulation-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b6560;
      margin-bottom: 0.6rem;
    }

    .articulation-badge {
      display: inline-block;
      background: white;
      border: 1px solid #ddd8d2;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2d2a27;
      cursor: pointer;
      transition: all 0.1s;
      margin: 0.2rem 0.2rem 0.2rem 0;
    }

    .articulation-badge.active {
      background: #c44536;
      border-color: #c44536;
      color: white;
    }

    .articulation-badge:hover:not(.active) {
      background: #f0ebe6;
    }

    /* save & post */
    .action-bar {
      margin-top: 2.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      border-top: 1px solid #e5ded7;
      padding-top: 1.8rem;
    }

    .btn-primary {
      background: #1e1b1a;
      border: none;
      color: white;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .btn-primary i {
      font-size: 1rem;
    }

    .btn-primary:hover {
      background: #3d2f2b;
      transform: scale(0.98);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #c5bdb5;
      color: #3d3a37;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-outline:hover {
      background: #f0ebe6;
      border-color: #a89f96;
    }

    .status-badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: #e8e0d9;
      padding: 0.25rem 1.2rem;
      border-radius: 30px;
      color: #3d3a37;
    }

    /* -------- right panel (piano roll / player) -------- */
    .panel-right {
      background: #fcfaf8;
      border-radius: 1.8rem;
      padding: 1.5rem 1.2rem 1.8rem;
      border: 1px solid #ede8e2;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .player-header h3 {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2d2a27;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .play-btn {
      background: #c44536;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(196, 69, 54, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover {
      background: #a8372a;
      transform: scale(0.96);
    }

    .play-btn.playing {
      background: #3d3a37;
    }

    /* simple keyboard / note grid */
    .piano-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 0.8rem;
    }

    .note-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .note-label {
      width: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #6b6560;
      text-align: right;
      padding-right: 0.3rem;
    }

    .note-cells {
      display: flex;
      flex: 1;
      gap: 4px;
      flex-wrap: wrap;
    }

    .note-cell {
      background: #ede8e2;
      border-radius: 8px;
      height: 34px;
      flex: 1 0 28px;
      min-width: 28px;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #e0d8d0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .note-cell.active {
      background: #c44536;
      border-color: #b03a2d;
      box-shadow: 0 2px 6px rgba(196, 69, 54, 0.3);
    }

    .note-cell.playing-highlight {
      background: #d67a6b;
      border-color: #b85a4b;
      transform: scale(0.96);
    }

    .note-cell:hover {
      background: #d5cdc4;
    }

    .note-cell.active:hover {
      background: #b03a2d;
    }

    .control-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
      gap: 1.2rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .save-indicator {
      font-size: 0.8rem;
      color: #5f5b58;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f0ebe6;
      padding: 0.2rem 1rem;
      border-radius: 30px;
    }

    .public-badge {
      background: #1e1b1a;
      color: white;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.75rem;
      color: #8f8982;
      text-align: center;
      border-top: 1px solid #ede8e2;
      padding-top: 1.5rem;
    }

    .footer-note i {
      margin: 0 4px;
    }
  </style>
</head>
<body>
<div class="app">
  <header style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div>
      <h1><i class="fas fa-music"></i> Compose</h1>
      <div class="subhead">
        <span>🎹 click cells to compose · press play</span>
        <span><i class="far fa-circle"></i> 4/4 · C major</span>
      </div>
    </div>
  </header>

  <div class="grid-2col">
    <!-- LEFT panel: instruments & articulations -->
    <div class="panel-left">
      <h3><i class="fas fa-sliders-h"></i> Instrument</h3>
      <div class="instrument-group">
        <label>Choose sound</label>
        <div class="instrument-selector" id="instrumentSelector">
          <button class="inst-btn active" data-instrument="piano"><i class="fas fa-piano"></i> Piano</button>
          <button class="inst-btn" data-instrument="guitar"><i class="fas fa-guitar"></i> Guitar</button>
          <button class="inst-btn" data-instrument="violin"><i class="fas fa-violin"></i> Violin</button>
          <button class="inst-btn" data-instrument="flute"><i class="fas fa-flute"></i> Flute</button>
        </div>
      </div>

      <div class="articulation-group">
        <label><i class="fas fa-flag"></i> Articulation</label>
        <div id="articulationContainer">
          <span class="articulation-badge active" data-articulation="legato">legato</span>
          <span class="articulation-badge" data-articulation="staccato">staccato</span>
          <span class="articulation-badge" data-articulation="marcato">marcato</span>
          <span class="articulation-badge" data-articulation="pizzicato">pizzicato</span>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" id="saveCompositionBtn"><i class="fas fa-save"></i> Save</button>
        <button class="btn-outline" id="postCompositionBtn"><i class="fas fa-globe"></i> Post</button>
        <span class="status-badge" id="statusBadge"><i class="fas fa-check-circle" style="color: #2b7a4b;"></i> draft</span>
      </div>
      <div style="margin-top: 0.5rem; font-size: 0.75rem; color: #7b736b; display: flex; gap: 1rem;">
        <span><i class="far fa-clock"></i> auto-save</span>
        <span><i class="fas fa-user-friends"></i> public view enabled</span>
      </div>
    </div>

    <!-- RIGHT panel: piano roll + player -->
    <div class="panel-right">
      <div class="player-header">
        <h3><i class="fas fa-edit"></i> Composition</h3>
        <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
      </div>

      <!-- Piano roll: 8 notes (C4–C5) x 8 steps -->
      <div class="piano-grid" id="pianoGrid">
        <!-- rows will be injected by JS -->
      </div>

      <div class="control-row">
        <span class="save-indicator"><i class="fas fa-database"></i> <span id="saveIndicator">saved locally</span></span>
        <span class="public-badge"><i class="fas fa-eye"></i> public</span>
      </div>
      <div class="footer-note">
        <i class="fas fa-arrows-alt-h"></i> click any cell · <i class="fas fa-play"></i> listen · <i class="fas fa-save"></i> save & post
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- state -----
    const state = {
      instrument: 'piano',
      articulation: 'legato',
      // 8 notes (C4, D4, E4, F4, G4, A4, B4, C5)
      notes: ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'],
      steps: 8,
      grid: [], // 8 x 8 boolean
      isPlaying: false,
      playInterval: null,
    };

    // initialize grid (all false)
    function initGrid() {
      state.grid = Array.from({ length: state.notes.length }, () => 
        Array(state.steps).fill(false)
      );
    }
    initGrid();

    // DOM refs
    const gridContainer = document.getElementById('pianoGrid');
    const playBtn = document.getElementById('playBtn');
    const statusBadge = document.getElementById('statusBadge');
    const saveIndicator = document.getElementById('saveIndicator');

    // instrument buttons
    const instBtns = document.querySelectorAll('.inst-btn');
    const artBadges = document.querySelectorAll('.articulation-badge');

    // ----- render piano roll -----
    function renderGrid() {
      gridContainer.innerHTML = '';
      for (let row = 0; row < state.notes.length; row++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'note-row';
        const label = document.createElement('span');
        label.className = 'note-label';
        label.textContent = state.notes[row];
        rowDiv.appendChild(label);

        const cellsDiv = document.createElement('div');
        cellsDiv.className = 'note-cells';
        for (let col = 0; col < state.steps; col++) {
          const cell = document.createElement('div');
          cell.className = 'note-cell';
          if (state.grid[row][col]) cell.classList.add('active');
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.addEventListener('click', () => toggleCell(row, col));
          cellsDiv.appendChild(cell);
        }
        rowDiv.appendChild(cellsDiv);
        gridContainer.appendChild(rowDiv);
      }
    }

    function toggleCell(row, col) {
      if (state.isPlaying) return; // no editing while playing
      state.grid[row][col] = !state.grid[row][col];
      renderGrid();
      updateSaveIndicator('edited');
    }

    // ----- playback (Web Audio) -----
    let audioCtx = null;
    let currentStep = 0;
    let timeoutId = null;

    function playComposition() {
      if (state.isPlaying) {
        stopPlayback();
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      // check if any note active
      const hasNotes = state.grid.some(row => row.some(cell => cell));
      if (!hasNotes) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> no notes`;
        setTimeout(() => updateStatusDraft(), 1500);
        return;
      }

      state.isPlaying = true;
      playBtn.innerHTML = '<i class="fas fa-stop"></i>';
      playBtn.classList.add('playing');
      currentStep = 0;
      statusBadge.innerHTML = `<i class="fas fa-play" style="color:#c44536;"></i> playing`;

      // schedule next step
      scheduleStep(currentStep);
    }

    function scheduleStep(step) {
      if (!state.isPlaying) return;
      if (step >= state.steps) {
        stopPlayback();
        return;
      }

      // play active notes for this step
      const notesToPlay = [];
      for (let row = 0; row < state.notes.length; row++) {
        if (state.grid[row][step]) {
          notesToPlay.push(state.notes[row]);
        }
      }

      // highlight cells
      const allCells = gridContainer.querySelectorAll('.note-cell');
      allCells.forEach(cell => cell.classList.remove('playing-highlight'));
      // highlight current column
      const cellsAtStep = document.querySelectorAll(`.note-cell[data-col="${step}"]`);
      cellsAtStep.forEach(cell => {
        if (cell.classList.contains('active')) {
          cell.classList.add('playing-highlight');
        }
      });

      // play notes with Web Audio
      if (notesToPlay.length > 0) {
        playNotes(notesToPlay);
      }

      // schedule next step after ~300ms (eighth note feel)
      timeoutId = setTimeout(() => {
        scheduleStep(step + 1);
      }, 300);
    }

    function playNotes(noteNames) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      // base frequency mapping (simplified)
      const freqMap = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
        'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25
      };

      noteNames.forEach(note => {
        const freq = freqMap[note] || 440;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth'; // a bit more character

        // articulation : simple envelope
        let duration = 0.2;
        let attack = 0.01;
        let release = 0.05;
        if (state.articulation === 'staccato') { duration = 0.12; attack = 0.005; release = 0.03; }
        else if (state.articulation === 'marcato') { duration = 0.25; attack = 0.02; release = 0.08; }
        else if (state.articulation === 'pizzicato') { duration = 0.1; attack = 0.001; release = 0.02; }
        else { // legato
          duration = 0.3; attack = 0.01; release = 0.06;
        }

        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.25, now + attack);
        gain.gain.linearRampToValueAtTime(0.25, now + duration - release);
        gain.gain.linearRampToValueAtTime(0, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      });
    }

    function stopPlayback() {
      state.isPlaying = false;
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      playBtn.classList.remove('playing');
      // remove highlights
      document.querySelectorAll('.note-cell').forEach(cell => cell.classList.remove('playing-highlight'));
      updateStatusDraft();
    }

    function updateStatusDraft() {
      statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> draft`;
    }

    function updateSaveIndicator(text) {
      saveIndicator.textContent = text || 'saved';
    }

    // ----- instrument & articulation switch -----
    function setInstrument(inst) {
      state.instrument = inst;
      instBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.instrument === inst);
      });
      // update status (visual)
      statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> ${inst}`;
      setTimeout(updateStatusDraft, 800);
    }

    function setArticulation(art) {
      state.articulation = art;
      artBadges.forEach(b => {
        b.classList.toggle('active', b.dataset.articulation === art);
      });
    }

    // ----- save & post -----
    function saveComposition() {
      // just a visual feedback, in real app would save to backend
      const hasNotes = state.grid.some(row => row.some(cell => cell));
      if (!hasNotes) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> nothing to save`;
        setTimeout(updateStatusDraft, 1500);
        return;
      }
      statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> saved ✓`;
      saveIndicator.textContent = 'saved just now';
      setTimeout(updateStatusDraft, 2000);
    }

    function postComposition() {
      const hasNotes = state.grid.some(row => row.some(cell => cell));
      if (!hasNotes) {
        statusBadge.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#b85a4b;"></i> add notes first`;
        setTimeout(updateStatusDraft, 1500);
        return;
      }
      statusBadge.innerHTML = `<i class="fas fa-globe" style="color:#1e6f5c;"></i> posted public!`;
      saveIndicator.textContent = 'public 🌍';
      // in a real app: POST to server
      setTimeout(() => {
        statusBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#2b7a4b;"></i> public`;
      }, 2000);
    }

    // ----- event bindings -----
    instBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.isPlaying) return;
        setInstrument(btn.dataset.instrument);
      });
    });

    artBadges.forEach(badge => {
      badge.addEventListener('click', () => {
        if (state.isPlaying) return;
        setArticulation(badge.dataset.articulation);
      });
    });

    playBtn.addEventListener('click', playComposition);

    document.getElementById('saveCompositionBtn').addEventListener('click', saveComposition);
    document.getElementById('postCompositionBtn').addEventListener('click', postComposition);

    // set default active articulation
    setArticulation('legato');
    renderGrid();
    updateStatusDraft();

    // extra: stop playback on page unload
    window.addEventListener('beforeunload', function() {
      if (state.isPlaying) stopPlayback();
      if (audioCtx && audioCtx.state !== 'closed') {
        audioCtx.close();
      }
    });

    // small demo : prefill some notes (example)
    function prefillDemo() {
      // add a little melody C4, E4, G4, C5 ...
      const demo = [[0,0],[1,1],[2,2],[0,3],[4,4],[2,5],[0,6],[3,7]];
      demo.forEach(([row, col]) => {
        if (row < state.notes.length && col < state.steps) {
          state.grid[row][col] = true;
        }
      });
      renderGrid();
    }
    prefillDemo();

  })();
</script>
</body>
</html>
