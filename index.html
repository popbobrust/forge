<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♭·io · sheet music composer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .flat-card {
      max-width: 1100px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
      padding: 30px 35px 40px;
      transition: all 0.2s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: #1e2b3c;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #1e2b3c;
    }

    .logo-text span {
      color: #6c7a8a;
      font-weight: 400;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: transparent;
      border: 1px solid #e2e8f0;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      color: #1e2b3c;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      background: white;
    }

    .btn-primary {
      background: #1e2b3c;
      border: 1px solid #1e2b3c;
      color: white;
    }

    .btn-primary i {
      color: white;
    }

    .btn:hover {
      background: #f1f4f9;
      border-color: #cbd5e1;
    }

    .btn-primary:hover {
      background: #2c3d52;
      border-color: #2c3d52;
    }

    .score-container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 4px 16px rgba(0,0,0,0.02);
      padding: 20px 10px 10px 10px;
      margin-bottom: 20px;
      border: 1px solid #edf2f7;
      position: relative;
      user-select: none;
    }

    #musicCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      border-radius: 16px;
      cursor: pointer;
      touch-action: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin: 18px 0 12px 0;
      padding: 6px 4px;
      border-top: 1px solid #ecf1f7;
      border-bottom: 1px solid #ecf1f7;
      padding: 14px 0;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-group-label {
      font-size: 12px;
      font-weight: 600;
      color: #5e6f7e;
      letter-spacing: 0.3px;
      margin-right: 4px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #1f2a36;
      background: white;
      border: 1px solid transparent;
      transition: 0.1s;
      cursor: pointer;
    }

    .tool-btn i {
      font-size: 18px;
      color: #2c3d4f;
    }

    .tool-btn.active {
      background: #eef3fa;
      border-color: #cbdae9;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    .tool-btn:hover {
      background: #f0f4fc;
      border-color: #d0ddee;
    }

    .separator {
      width: 1px;
      height: 28px;
      background: #e2eaf3;
      margin: 0 6px;
    }

    .playback-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .play-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-btn {
      background: #1e2b3c;
      border: none;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 40px;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .play-btn:hover {
      background: #2d3f53;
      transform: scale(1.02);
    }

    .status {
      color: #4b5e6f;
      font-size: 14px;
      font-weight: 450;
      background: #f0f5fc;
      padding: 6px 18px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status i {
      color: #3b7c5c;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid #e2e8f0;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      color: #4d6072;
      cursor: pointer;
      transition: 0.1s;
    }

    .clear-btn:hover {
      background: #f8faff;
      border-color: #bcccdb;
    }

    @media (max-width: 680px) {
      .flat-card {
        padding: 20px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .action-buttons {
        width: 100%;
        justify-content: flex-start;
      }
      .toolbar {
        gap: 12px;
      }
    }

    .note-badge {
      background: #eaf1fb;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #1e2b3c;
    }
  </style>
</head>
<body>

<div class="flat-card">
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon">♭</div>
      <div class="logo-text">flat<span>·io</span></div>
    </div>
    <div class="action-buttons">
      <button class="btn" id="exportBtn"><i class="fas fa-download"></i> Export</button>
      <button class="btn btn-primary" id="newScoreBtn"><i class="fas fa-plus"></i> New score</button>
    </div>
  </div>

  <div class="score-container">
    <canvas id="musicCanvas" width="1000" height="200"></canvas>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <span class="tool-group-label"><i class="fas fa-music"></i> Duration</span>
      <button class="tool-btn active" id="durQuarter"><i class="fas fa-circle"></i></button>
      <button class="tool-btn" id="durHalf"><i class="far fa-circle"></i></button>
      <button class="tool-btn" id="durWhole"><i class="far fa-circle" style="border:2px solid #1f2a36; border-radius:50%; padding:2px;"></i></button>
    </div>

    <div class="separator"></div>

    <div class="tool-group">
      <span class="tool-group-label"><i class="fas fa-arrow-up"></i> Octave</span>
      <button class="tool-btn" id="octaveDown"><i class="fas fa-minus"></i></button>
      <span class="note-badge" id="octaveDisplay">4</span>
      <button class="tool-btn" id="octaveUp"><i class="fas fa-plus"></i></button>
    </div>
  </div>

  <div class="playback-bar">
    <div class="play-controls">
      <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
      <span class="status"><i class="fas fa-check-circle"></i> <span id="noteCount">0</span> notes</span>
    </div>
    <div>
      <button class="clear-btn" id="clearBtn"><i class="fas fa-eraser"></i> Clear all</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('musicCanvas');
    const ctx = canvas.getContext('2d');

    let notes = [];             // { pitch, octave, duration, x }
    let currentOctave = 4;
    let currentDuration = 'quarter';

    const octaveDisplay = document.getElementById('octaveDisplay');
    const noteCountSpan = document.getElementById('noteCount');

    const durQuarter = document.getElementById('durQuarter');
    const durHalf = document.getElementById('durHalf');
    const durWhole = document.getElementById('durWhole');

    // ----- helper: get pitch from mouse Y -----
    function getPitchFromY(y) {
      // staff lines: startY = 60, spacing = 16, 5 lines
      const startY = 60;
      const lineSpacing = 16;
      // map y to pitch: we consider the space between lines and lines.
      // We'll map C4 to the space just below the first line (y = startY + lineSpacing/2)
      // We'll define a mapping from y to pitch offset (0 = C4)
      // We use a continuous mapping: each semitone step = lineSpacing/2 = 8px
      const step = lineSpacing / 2; // 8px per semitone
      // C4 is at y = startY + lineSpacing + 2 (approx middle of staff) 
      // we set C4 at y = startY + lineSpacing + 2
      const c4y = startY + lineSpacing + 2;
      const offset = (c4y - y) / step; // positive = higher pitch
      // round to nearest semitone, clamp
      let semitone = Math.round(offset);
      // clamp to range C3 ( -12 ) to B6 ( +21 ) 
      semitone = Math.min(Math.max(semitone, -12), 21);
      // map semitone to pitch name and octave
      const pitchNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      // C4 = semitone 0
      let octave = 4 + Math.floor((semitone + 12) / 12) - 1;
      let pitchIndex = ((semitone % 12) + 12) % 12;
      let pitch = pitchNames[pitchIndex];
      // adjust octave for wrap
      if (pitchIndex < 0) pitchIndex += 12;
      if (pitch === 'C' && semitone >= 0) octave = 4 + Math.floor((semitone + 12) / 12) - 1;
      else if (pitch === 'C' && semitone < 0) octave = 4 + Math.floor((semitone + 12) / 12) - 1;
      else {
        octave = 4 + Math.floor((semitone + 12) / 12) - 1;
      }
      // ensure octave between 2 and 7
      octave = Math.min(Math.max(octave, 2), 7);
      return { pitch, octave };
    }

    // ----- drawing -----
    function drawScore() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#fbfdff';
      ctx.fillRect(0, 0, w, h);

      const lineSpacing = 16;
      const startY = 60;
      ctx.strokeStyle = '#2f3e4e';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) {
        const y = startY + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(20, y);
        ctx.lineTo(w - 20, y);
        ctx.stroke();
      }

      // treble clef
      ctx.font = '44px "Times New Roman", serif';
      ctx.fillStyle = '#1f2a36';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('𝄞', 42, startY + 2 * lineSpacing + 2);

      // draw notes
      notes.forEach((note) => {
        const pitch = note.pitch;
        const octave = note.octave;
        const dur = note.duration || 'quarter';
        const x = note.x;

        // map pitch+octave to y
        const pitchOffsets = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
        let semitone = pitchOffsets[pitch] + (octave - 4) * 12;
        const step = 8; // px per semitone
        const c4y = startY + lineSpacing + 2;
        const yPos = c4y - semitone * step;

        // draw notehead
        ctx.beginPath();
        ctx.ellipse(x, yPos, 8, 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#1e2b3c';
        ctx.fill();
        ctx.strokeStyle = '#1e2b3c';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // stem
        if (dur !== 'whole') {
          ctx.beginPath();
          ctx.moveTo(x + 8, yPos - 2);
          ctx.lineTo(x + 8, yPos - 32);
          ctx.stroke();
          if (dur === 'quarter') {
            ctx.beginPath();
            ctx.moveTo(x + 8, yPos - 32);
            ctx.quadraticCurveTo(x + 20, yPos - 26, x + 16, yPos - 16);
            ctx.stroke();
          }
        }
      });
    }

    function updateNoteCount() {
      noteCountSpan.textContent = notes.length;
    }

    // ----- add note at mouse position -----
    function addNoteAtMouse(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      if (mouseX < 30 || mouseX > canvas.width - 30) return;
      
      const { pitch, octave } = getPitchFromY(mouseY);
      // we ignore currentOctave, use computed octave from mouse
      // but we respect the octave range
      const newNote = {
        pitch: pitch,
        octave: octave,
        duration: currentDuration,
        x: Math.min(Math.max(mouseX, 40), canvas.width - 40)
      };
      notes.push(newNote);
      updateNoteCount();
      drawScore();
    }

    // ----- delete note at mouse position (right-click) -----
    function deleteNoteAtMouse(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      
      // find closest note within 20px
      let closest = -1;
      let minDist = 25;
      notes.forEach((note, index) => {
        const dx = note.x - mouseX;
        const pitchOffsets = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
        let semitone = pitchOffsets[note.pitch] + (note.octave - 4) * 12;
        const step = 8;
        const c4y = 60 + 16 + 2;
        const noteY = c4y - semitone * step;
        const dy = noteY - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist) {
          minDist = dist;
          closest = index;
        }
      });
      if (closest !== -1) {
        notes.splice(closest, 1);
        updateNoteCount();
        drawScore();
      }
    }

    // ----- canvas events -----
    canvas.addEventListener('click', addNoteAtMouse);
    canvas.addEventListener('contextmenu', deleteNoteAtMouse);

    // ----- toolbar: duration -----
    function setDuration(dur, activeBtn) {
      currentDuration = dur;
      [durQuarter, durHalf, durWhole].forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    durQuarter.addEventListener('click', () => setDuration('quarter', durQuarter));
    durHalf.addEventListener('click', () => setDuration('half', durHalf));
    durWhole.addEventListener('click', () => setDuration('whole', durWhole));

    // octave controls (only for display, but we use mouse for pitch)
    document.getElementById('octaveUp').addEventListener('click', () => {
      if (currentOctave < 7) currentOctave++;
      octaveDisplay.textContent = currentOctave;
    });
    document.getElementById('octaveDown').addEventListener('click', () => {
      if (currentOctave > 2) currentOctave--;
      octaveDisplay.textContent = currentOctave;
    });

    // clear
    document.getElementById('clearBtn').addEventListener('click', () => {
      notes = [];
      updateNoteCount();
      drawScore();
    });

    document.getElementById('newScoreBtn').addEventListener('click', () => {
      notes = [];
      updateNoteCount();
      drawScore();
    });

    // export
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify(notes, null, 2);
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'flat_score.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // ----- playback -----
    let audioCtx = null;
    let isPlaying = false;

    function playNote(pitch, octave, durationSec = 0.35) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const pitchOffsets = { 'C': -9, 'C#': -8, 'D': -7, 'D#': -6, 'E': -5, 'F': -4, 'F#': -3, 'G': -2, 'G#': -1, 'A': 0, 'A#': 1, 'B': 2 };
      const semitone = pitchOffsets[pitch] + (octave - 4) * 12;
      const freq = 440 * Math.pow(2, semitone / 12);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationSec);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationSec);
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) return;
      if (notes.length === 0) {
        alert('Add some notes first!');
        return;
      }
      isPlaying = true;
      const playBtn = document.getElementById('playBtn');
      playBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
      
      const sorted = [...notes].sort((a,b) => a.x - b.x);
      let delay = 0;
      const step = 0.32;

      sorted.forEach((note) => {
        const dur = note.duration === 'whole' ? 0.8 : note.duration === 'half' ? 0.55 : 0.35;
        setTimeout(() => {
          playNote(note.pitch, note.octave, dur);
        }, delay * 1000);
        delay += step;
      });

      setTimeout(() => {
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
      }, (delay + 0.3) * 1000);
    });

    // initial draw
    drawScore();
    updateNoteCount();
  })();
</script>
</body>
</html>
